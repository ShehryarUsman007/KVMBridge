[package]
name = "kvmbridge-platform"
description = "OS specific input capture/emulation, clipboard and drag-and-drop backends for KVM Bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kvmbridge-core = { path = "../core" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "input_capture", "remote_desktop", "screencast", "clipboard"] }
reis = { version = "0.7", features = ["tokio"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
