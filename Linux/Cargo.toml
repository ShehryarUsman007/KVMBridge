[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["KVM Bridge contributors"]
repository = "https://github.com/kvmbridge/kvmbridge"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
parking_lot = "0.12"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
