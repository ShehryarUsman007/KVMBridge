[package]
name = "kvmbridge"
description = "KVM Bridge - share one keyboard and mouse, the clipboard and files between computers"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "kvmbridge"

[[bin]]
name = "kvmbridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
kvmbridge-core.workspace = true
kvmbridge-platform = { path = "../crates/platform" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging"] }
