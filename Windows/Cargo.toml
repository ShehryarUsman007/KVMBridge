# The Windows version. The engine, protocol and encryption are the Linux
# folder's core crate, used as is, so both versions speak exactly the same
# protocol. The user interface is Linux/ui.
[workspace]
resolver = "2"
members = ["crates/platform", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["KVM Bridge contributors"]
rust-version = "1.80"

[workspace.dependencies]
kvmbridge-core = { path = "../Linux/crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
